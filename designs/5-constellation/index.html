<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiannah's — Coming soon</title>
  <meta name="description" content="Tiannah's — something good is coming to the Gold Coast.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cobalt: #0047AB;
      --cerulean: #2A9FD6;
      --teal: #00A6A6;
      --neon: #00D9C8;
      --porcelain: #F5F8FB;
      --ink: #0C1A33;
      --ink-soft: #4F5F7A;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      background: var(--porcelain);
      color: var(--ink);
      font-family: "Jost", system-ui, sans-serif;
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
    }

    /* ---------- Constellation background ---------- */
    .sky {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 35%, #FFFFFF 0%, var(--porcelain) 55%, #E6EEF6 100%);
    }

    .sky line { stroke-width: 1; opacity: 0.35; }
    .sky circle { opacity: 0.8; }

    /* Three layers drifting at different speeds give a slow parallax. */
    .layer { animation: drift-a 70s ease-in-out infinite alternate; }
    .layer--mid  { animation-name: drift-b; animation-duration: 55s; }
    .layer--near { animation-name: drift-c; animation-duration: 42s; }
    .layer--far line  { opacity: 0.25; }
    .layer--near line { opacity: 0.3; }

    @keyframes drift-a { to { transform: translate(-60px, 30px); } }
    @keyframes drift-b { to { transform: translate(70px, -40px); } }
    @keyframes drift-c { to { transform: translate(-50px, -60px); } }

    .twinkle {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 5s ease-in-out infinite alternate;
    }

    .twinkle:nth-of-type(2n) { animation-delay: -2s; animation-duration: 7s; }
    .twinkle:nth-of-type(3n) { animation-delay: -4s; animation-duration: 6s; }

    @keyframes twinkle {
      from { transform: scale(1);   opacity: 0.8; }
      to   { transform: scale(2.2); opacity: 0.25; }
    }

    /* ---------- Layout ---------- */
    .page {
      max-width: 620px;
      margin: 0 auto;
      padding: clamp(3rem, 9vh, 6rem) clamp(1rem, 5vw, 2rem) 3rem;
      text-align: center;
    }

    /* The punk bit: a neon-teal studded collar. */
    .studded {
      border: 6px dotted var(--neon);
      outline: 1.5px solid var(--neon);
      outline-offset: 5px;
      box-shadow: 0 0 0 12px rgba(0, 217, 200, 0.06), 0 0 30px rgba(0, 217, 200, 0.25);
    }

    .portrait {
      width: min(200px, 52vw);
      aspect-ratio: 1;
      margin: 0 auto 2.5rem;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(160deg, #E7F1FA, #CFE3F3);
    }

    .portrait img { display: block; width: 100%; height: auto; }

    .eyebrow {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--teal);
      margin: 0 0 0.5rem;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 300;
      font-size: clamp(3.8rem, 13vw, 7.5rem);
      line-height: 0.9;
      letter-spacing: -0.01em;
      color: var(--cobalt);
      margin: 0;
    }

    h1 em { color: var(--cerulean); }

    .rule {
      width: 64px;
      height: 1px;
      margin: 1.75rem auto;
      background: var(--teal);
    }

    .tagline {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: clamp(1.3rem, 3vw, 1.6rem);
      color: var(--ink-soft);
      margin: 0 0 3rem;
      text-wrap: balance;
    }

    /* ---------- Contact card ---------- */
    .card {
      text-align: left;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 18px;
      padding: clamp(1.5rem, 5vw, 2.5rem);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .card h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: 1.9rem;
      line-height: 1.1;
      color: var(--cobalt);
      margin: 0 0 0.3rem;
    }

    .card form > p, .thanks p { color: var(--ink-soft); margin: 0 0 1.5rem; }

    .field { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    input, textarea {
      width: 100%;
      font: inherit;
      font-weight: 400;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid #B9C7DA;
      border-radius: 0;
      padding: 0.5rem 0;
      transition: border-color 0.2s;
    }

    textarea { resize: vertical; min-height: 5.5rem; }

    input:focus-visible, textarea:focus-visible {
      outline: none;
      border-bottom: 2px solid var(--teal);
    }

    button {
      font: inherit;
      font-weight: 500;
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--cobalt);
      background: transparent;
      border: 1.5px solid var(--cobalt);
      border-radius: 999px;
      padding: 0.85rem 2.2rem;
      cursor: pointer;
      transition: background 0.25s, color 0.25s;
    }

    button:hover { background: var(--cobalt); color: #FFFFFF; }
    button:focus-visible { outline: 2px solid var(--neon); outline-offset: 4px; }

    .hp { display: none; }

    .thanks { display: none; }
    .thanks:target { display: block; }
    .thanks:target ~ form { display: none; }

    footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

  <main class="page">
    <div class="portrait studded">
      <picture>
        <source srcset="../../assets/tiannah.webp" type="image/webp">
        <img src="../../assets/tiannah.png" alt="Illustrated portrait of Tiannah" width="800" height="800">
      </picture>
    </div>

    <p class="eyebrow">Gold Coast · Opening soon</p>
    <h1>Tiannah<em>'s</em></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tagline">Something good is coming. Thoughtfully made, and worth the wait.</p>

    <section class="card studded" aria-labelledby="contact-heading">
      <div id="thanks" class="thanks" role="status">
        <h2>Thank you</h2>
        <p>Your message is on its way. Tiannah will be in touch soon.</p>
      </div>

      <form action="https://api.web3forms.com/submit" method="post">
        <h2 id="contact-heading">Get in touch</h2>
        <p>For enquiries, collaborations, or early news, leave a message below.</p>

        <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
        <input type="hidden" name="subject" value="New message from tiannahs.com">
        <input type="hidden" name="from_name" value="tiannahs.com">
        <input type="hidden" name="redirect" value="https://tiannahs.com/#thanks">
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">

        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit">Send</button>
      </form>
    </section>

    <footer>© 2026 Tiannah's</footer>
  </main>
